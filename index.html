@font-face{font-family:'Golos Text';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/golos-400.ttf) format('truetype')}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/golos-600.ttf) format('truetype')}

/* стиль «Светлый минимализм»: воздух, белые карточки без рамок, один синий акцент, цифра — главный герой */
:root{
  --bg:#F6F7FA; --card:#FFFFFF; --ink:#14171C; --muted:#6B7280; --line:#E9ECF1;
  --dark:#14171C; --dark-ink:#FFFFFF; --gold:#0A63FF; --gold-ink:#0A63FF; --acc-soft:#E8F0FF;
  --good:#12875A; --good-bg:#E4F5EC; --warn:#A35F00; --warn-bg:#FDF1D8; --bad:#D6343B; --bad-bg:#FCE7E8;
  --input:#F1F3F7; --shadow:0 1px 2px rgba(20,23,28,.05),0 6px 18px rgba(20,23,28,.04);
  --bar:rgba(255,255,255,.82); --bar-line:rgba(20,23,28,.08); --top-bg:rgba(246,247,250,.82);
  --font:'Golos Text',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0D10; --card:#15181D; --ink:#F3F5F7; --muted:#9AA3AE; --line:#232830;
    --dark:#2A2F37; --dark-ink:#F3F5F7; --gold:#3D86FF; --gold-ink:#6BA4FF; --acc-soft:#16233A;
    --good:#4FD39B; --good-bg:#12302A; --warn:#F5C55A; --warn-bg:#352C14; --bad:#FF8A8F; --bad-bg:#3A1B1D;
    --input:#1D2127; --shadow:none;
    --bar:rgba(21,24,29,.82); --bar-line:rgba(243,245,247,.08); --top-bg:rgba(11,13,16,.82);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--top-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:10px}
.top img{width:30px;height:30px;border-radius:8px}
.brand{font-weight:800;letter-spacing:2px;font-size:14px;color:var(--ink);transition:opacity .2s}
.sub{position:absolute;left:64px;right:64px;bottom:0;height:50px;line-height:50px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none}
.top.scrolled .brand{opacity:0}
.top.scrolled .sub{opacity:1}
main{max-width:720px;margin:0 auto;padding:12px 16px 16px;overflow-x:hidden;overflow-x:clip}
body.has-install{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
/* крупный заголовок раздела (Large Title) */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.lt h1{font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.8px;margin:0;overflow-wrap:anywhere}
.lt .btn{flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bar-line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button svg{width:24px;height:24px;transition:transform .12s}
.tabs button:active svg{transform:scale(.88)}
.tabs button.on{color:var(--gold-ink);font-weight:600}
.tabs button.on svg{color:var(--gold-ink)}
h2{font-size:22px;font-weight:600;letter-spacing:-.3px;margin:4px 0 12px}
h3{font-size:16px;font-weight:600;margin:0 0 12px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap span{position:absolute;right:10px;font-size:14px;color:var(--muted);pointer-events:none}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=tel],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--input);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-height:46px}
.inwrap input{padding-right:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;background:var(--card)}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;background:var(--input);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:8px 6px;border-radius:8px;min-height:38px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,23,28,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;border-radius:14px;padding:10px 16px;min-height:46px;border:0;background:var(--acc-soft);color:var(--gold-ink);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--gold);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:center;min-height:48px;padding:6px 0;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--gold)}
.chkrow{display:flex;align-items:flex-start;gap:8px}
.chkrow .chk{flex:1;min-width:0}
.riskbtn{flex:none;width:36px;height:36px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--muted);font:inherit;font-weight:800;cursor:pointer}
.riskbtn.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.riskin{margin:0 0 8px 32px}
.stg th,.stg td{padding:9px 6px}
.stg .planrow td{background:var(--input)}
.verdict{text-align:center;padding:18px 8px 6px;margin-bottom:6px}
.verdict .v{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.02em;line-height:1.2;padding:7px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.verdict.good .v{color:var(--good)}
.verdict.warn .v{color:var(--warn)}
.verdict.bad .v{color:var(--bad)}
.verdict .lbl{color:var(--muted);font-size:14px;margin-top:22px}
.verdict .big{font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.verdict .big.neg{color:var(--bad)}
.verdict .sub2{color:var(--muted);font-size:15px}
.verdict .sub2 b{color:var(--ink);font-weight:600}
.verdict.good .sub2 b{color:var(--good)}
.verdict .sub2 b.neg{color:var(--bad)}
.verdict p{margin:12px auto 0;max-width:34em;color:var(--muted);font-size:14px}
.price-slide{padding-bottom:14px}
.price-slide .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price-slide .head span{color:var(--muted);font-size:14px}
.price-slide .head b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.price-slide input[type=range]{width:100%;height:32px;margin:6px 0 0;accent-color:var(--gold)}
.price-slide .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.kpis{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin:0 0 12px}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.kpi:last-child{border-bottom:0}
.kpi span{color:var(--muted)}
.kpi b{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.kpi b.neg{color:var(--bad)}
.stackbar{display:flex;gap:2px;height:14px;border-radius:999px;overflow:hidden}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend u{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0}
.neg{color:var(--bad)} .pos{color:var(--good)}
.pbar{height:10px;border-radius:99px;background:var(--input);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;min-width:0;border-radius:99px;background:var(--gold);transition:width .3s}
.pbar.good i{background:var(--good)} .pbar.warn i{background:var(--warn)} .pbar.bad i{background:var(--bad)}
.shopit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.shopit .ck{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:0}
.shopit .ck.on{background:var(--good);border-color:var(--good)}
.shopit .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.shopit .nm.dn{text-decoration:line-through;color:var(--muted)}
.shopit input{width:92px;text-align:right}
.shopst{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 0;text-transform:uppercase;letter-spacing:.03em}
.hot button{display:block;width:100%;text-align:left;font:inherit;color:inherit;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;cursor:pointer}
.hot button:first-of-type{border-top:0}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;height:56px;padding:0 22px;border:0;border-radius:28px;background:var(--gold);color:#fff;font:inherit;font-size:16px;font-weight:600;box-shadow:0 8px 24px rgba(10,99,255,.35);cursor:pointer}
.fab:active{transform:scale(.96)}
html[data-style="glass"] .fab{bottom:calc(108px + env(safe-area-inset-bottom))}
#xStages button,#xCats button{min-height:44px;padding:8px 16px}
#xRooms,#phRooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#xRooms button,#phRooms button{min-height:64px;padding:8px 6px;border-radius:16px;font-size:15px;line-height:1.2}
.exr td{padding-top:12px;padding-bottom:12px}.exr td.n{min-width:96px}.exa{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-top:6px}
.exb{min-height:48px;min-width:72px;padding:10px 14px;border:0;border-radius:12px;background:var(--input);color:var(--gold-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}.exb.bad{color:var(--bad);background:var(--bad-bg)}
.stagebar{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.stagebar::-webkit-scrollbar{display:none}
.stagebar button{flex:none;min-height:44px;padding:8px 14px;border:0;border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}.stagebar button.on{background:var(--gold);color:#fff}.stagebar i{flex:none;color:var(--muted);font-style:normal}
.dthumb{display:inline-block;width:36px;height:36px;margin-right:10px;border-radius:9px;overflow:hidden;vertical-align:middle;background:var(--input)}.dthumb:empty{display:none}.dthumb img{display:block;width:100%;height:100%;object-fit:cover}
.xnum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}.xnum button{min-height:56px;border:0;border-radius:14px;background:var(--input);color:var(--ink);font:inherit;font-size:22px;font-weight:600;cursor:pointer}.xnum button:active{transform:scale(.96)}.xnum .xc{grid-column:1/-1;min-height:44px;font-size:15px;color:var(--bad)}
.xq{display:flex;gap:6px;margin-top:8px}
.xq button{flex:1;min-width:0;min-height:44px;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:12px;background:var(--acc-soft);color:var(--gold-ink);cursor:pointer;padding:0 4px}
.xq button:active{transform:scale(.96)}
.rmrow{margin:10px 0}.rml{display:flex;justify-content:space-between;gap:10px}.rmbar{height:8px;border-radius:99px;background:var(--input);margin:5px 0 3px;overflow:hidden}.rmbar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.stg.scen{table-layout:fixed;width:100%}.stg.scen td,.stg.scen th{font-size:12px;padding:6px 2px;overflow-wrap:anywhere;white-space:normal}.stg.scen td:first-child,.stg.scen th:first-child{width:27%;text-align:left}
.gantt{position:relative}.gr{margin:9px 0}.gl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.gt{position:relative;height:20px;margin-top:3px;background:var(--input);border-radius:6px;overflow:hidden}
.gt i{position:absolute;top:0;height:100%;border-radius:6px;box-sizing:border-box}.gt .gp{top:0;height:7px;background:#B8C0CC}.gt .gf{top:8px;height:12px}
.gf.s-done{background:var(--good)}.gf.s-work{background:var(--gold)}.gf.s-late{background:var(--bad)}.gf.s-wait{background:#9AA6B8}
.gtoday{position:absolute;top:0;bottom:44px;width:0;border-left:2px dashed var(--bad);pointer-events:none}.gtoday span{position:absolute;bottom:-14px;left:0;transform:translateX(-50%);font-size:11px;color:var(--bad);background:var(--card);white-space:nowrap}.gtoday.l span{transform:none;left:-2px}.gtoday.r span{transform:translateX(-100%);left:2px}
.gax{display:flex;justify-content:space-between;margin-top:20px}.gkey{margin-top:2px}.gkey u{display:inline-block;width:14px;height:7px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle;text-decoration:none}.gkey u.gp{background:#B8C0CC;margin-left:0}.gkey u.gf{background:var(--gold)}
.tpl{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,Consolas,monospace;background:var(--input);border-radius:12px;padding:12px;margin:0;max-height:60vh;overflow:auto}
#msr{display:none;position:fixed;inset:0;z-index:98;background:#080A0E;overflow:auto;-webkit-overflow-scrolling:touch}#msr.on{display:block}
.rl-cv{display:block;margin:0 auto 10px;border-radius:12px;background:#000;touch-action:none;cursor:crosshair;max-width:100%}
.rl-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.rl-chips button{min-height:40px}
#msr .rl-in{width:100%;min-height:46px;font-size:16px;padding:8px 12px;border-radius:10px;border:1px solid #4A5361;background:#10141B;color:#fff;box-sizing:border-box}
.rl-list{margin:6px 0 10px;padding-left:20px;color:#fff}
.lv-wrap{display:flex;justify-content:center;align-items:center;min-height:250px;margin:14px 0 4px}
.lv-ring{position:relative;width:240px;height:240px;border-radius:50%;border:3px solid #6B7380;background:#10141B}
.lv-h,.lv-v{position:absolute;background:#2A313C}.lv-h{left:0;right:0;top:50%;height:1px}.lv-v{top:0;bottom:0;left:50%;width:1px}
.lv-dot{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#F5A524;border:2px solid #fff}
.lv-line{position:relative;width:min(320px,86vw);height:120px}
.lv-ref{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#6B7380}
.lv-bar{position:absolute;left:-8%;right:-8%;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#F5A524}
.lv-ok .lv-dot,.lv-ok .lv-bar{background:#2FB36B}
.lv-num{text-align:center;font-size:40px;font-weight:700;color:#fff;line-height:1.1}
.lv-mm{text-align:center;color:#C9CED6;margin:2px 0 8px;min-height:1.4em}
#camview{display:none;position:fixed;inset:0;z-index:97;background:#080A0E;overflow:auto}#camview.on{display:block}.cam-box{max-width:820px;margin:0 auto;padding:16px;color:#fff}.cam-box video{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:14px;background:#000;margin-bottom:10px}
#tlview{display:none;position:fixed;inset:0;z-index:96;background:#080A0E;overflow:auto;overscroll-behavior:contain}#tlview.on{display:block}

<script data-boot>
// Экран запуска показываем один раз за сеанс; при автоматических проверках — только по ?splash
// Стиль оформления: «light» (по умолчанию, светлый минимализм) или «glass» (жидкое стекло); выбор хранится отдельно от данных
try {
  var flStyle = localStorage.getItem('fl-style'), flTheme = {glass: '#05070F', terra: '#F4F1EA', emerald: '#14171A', indigo: '#F8F9FA'};
  if (flStyle !== 'light' && !flTheme[flStyle]) flStyle = 'light';
  document.documentElement.setAttribute('data-style', flStyle);
  if (flTheme[flStyle]) document.querySelector('meta[name="theme-color"]').setAttribute('content', flTheme[flStyle]);
} catch (e) { document.documentElement.setAttribute('data-style', 'light'); }
try { if (localStorage.getItem('fl-contrast') === '1') { document.documentElement.setAttribute('data-contrast', 'high'); document.documentElement.setAttribute('data-style', 'light'); } } catch (e) {}
try { if (sessionStorage.getItem('fl-splash') || (navigator.webdriver && !/splash/.test(location.search))) document.documentElement.classList.add('nosplash'); } catch (e) {}
</script>

// Сумма расхода с сокращениями: «45к», «45 тыс», «4,5м», «1,2 млн»; без суффикса — как parseNum
function parseAmount(s) {
  const t = String(s == null ? '' : s).toLowerCase().replace(/ /g, ' ').trim();
  const m = t.match(/^(\d[\d\s]*(?:[.,]\d+)?)\s*(млн|миллион[а-я]*|м|тыс|тысяч[а-я]*|к|k)?\.?(?:\s*₽|\s*р(?:уб[а-я.]*)?\.?)?$/);

async function thumbMake(blob) {
  let bmp = null;

    bmp = await createImageBitmap(blob); const px = 96;
    const cv = document.createElement('canvas'); cv.width = cv.height = px;
    const x = cv.getContext('2d'), sc = Math.max(px / bmp.width, px / bmp.height), w = bmp.width * sc, h = bmp.height * sc;
    x.drawImage(bmp, (px - w) / 2, (px - h) / 2, w, h);

}

const VH_CATS = [

  ['Демонтаж', /демонтаж|вывоз|мусор/], ['Электрика', /электрик|проводк/],
  ['Черновые работы', /стяжк|штукатур|сантехник|разводк/], ['Чистовые работы', /плитк|обо[ийя]|ламинат|покраск|краск|двер[ьи]/],

function vhDay(off) { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
function parseVoiceCmd(raw) {
  const t = String(raw == null ? '' : raw).replace(/[  ]/g, ' ').replace(/\s+/g, ' ').trim();
  const lo = t.toLowerCase();
  let day = '', time = '';
  const dm = lo.match(/(^|[^а-яё])(послезавтра|завтра|сегодня|вчера)(?![а-яё])/);
  if (dm) day = vhDay({'сегодня': 0, 'завтра': 1, 'послезавтра': 2, 'вчера': -1}[dm[2]]);
  // Время: «в 15:00», «к 9 часам», «в 15»; его позиция исключается из поиска суммы
  const tm = /(?:^|[^а-яё0-9])(?:в|к)\s*(\d{1,2})(?:[:.](\d{2}))?(?:\s*(?:час[а-яё]*|ч))?(?![\d:а-яё])/.exec(lo);
  let tFrom = -1, tTo = -1;
  if (tm && +tm[1] <= 23 && (!tm[2] || +tm[2] <= 59)) {
    time = two(+tm[1]) + ':' + (tm[2] || '00');
    tFrom = tm.index + tm[0].search(/\d/); tTo = tm.index + tm[0].length;
  }
  // Сумма: сначала числа с «тыс/млн/к/руб», иначе самое большое число от 100
  const re = /(\d+(?: \d{3})*(?:[.,]\d+)?)\s*(млн|миллион[а-яё]*|тыс[а-яё]*\.?|к|k|м)?(?![а-яёa-z\d:])(\s*(?:₽|руб[а-яё.]*|р(?![а-яё])\.?))?/gi;
  let m, best = null;
  while ((m = re.exec(t))) {
    if (m.index >= tFrom && m.index < tTo && tFrom >= 0) continue;
    const base = parseNum(m[1].replace(/ /g, '')), mult = !m[2] ? 1 : /^(к|k|тыс)/i.test(m[2]) ? 1e3 : 1e6;
    const v = Math.round(base * mult), strong = !!(m[2] || m[3]);
    if (!(v > 0) || v > 1e12 || (!strong && v < 100)) continue;
    if (!best || (strong && !best.strong) || (strong === best.strong && v > best.v)) best = {v, strong, s: m[0], i: m.index};
  }
  const sum = best ? best.v : 0;
  let note = t;
  if (best) note = note.slice(0, best.i) + ' ' + note.slice(best.i + best.s.length);
  note = note.replace(/(^|\s)(рублей|рубля|рубль|руб|₽|за|на|потратил[а-яё]*|оплатил[а-яё]*|заплатил[а-яё]*|расход|сегодня|вчера)(?=\s|$|[.,])/gi, ' ').replace(/\s+/g, ' ').replace(/^[\s.,;:—-]+|[\s.,;:—-]+$/g, '');
  if (note) note = note[0].toUpperCase() + note.slice(1);
  let cat = 'Прочее'; for (const [c, r] of VH_CATS) if (r.test(lo)) { cat = c; break; }
  let stage = ''; if (cat === 'Ремонт' || cat === 'Материалы') for (const [st, r] of VH_STAGES) if (r.test(lo)) { stage = st; break; }
  return {sum, cat, stage, note: note.slice(0, 300), day, time, text: t.slice(0, 300)};
}

const VOICE_VERB = /(^|\s)(откр\S*|покаж\S*|перейд\S*|перейти|зайд\S*|включ\S*|запуст\S*|вернис\S*)(\s|$)/;

const VOICE_ACT = /(заплат|оплат|потрат|купи|куплю|купил|вложи|встреч|созвон|звонок|позвон|звон|напомн|надо|нужн|хочу|договор\S*\s+с)/;
// Фраза → куда идти. Цифры в фразе — это уже расход или запись, навигацией не считаем.
function voiceNav(raw, deals) {
  const lo = normRu(raw).replace(/[.,!?;:«»"()]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!lo || /\d/.test(lo)) return null;
  const verb = VOICE_VERB.test(lo), words = lo.split(' ').length;
  if (!verb && (words > 3 || VOICE_ACT.test(lo))) return null;
  // Проект по названию: целиком или по основам слов («двушку» найдёт «Двушка»)
  let best = null;
  for (const d of (deals || [])) {
    const n = normRu(d.name || '').trim();
    if (n.length < 3) continue;
    let score = lo.includes(n) ? 100 : 0;
    n.split(/[^а-яa-z0-9]+/).filter(w => w.length >= 4).forEach(w => { if (lo.includes(w.slice(0, Math.max(4, w.length - 2)))) score++; });
    if (score > 0 && (!best || score > best.score)) best = {score, nav: {kind: 'deal', id: d.id, label: d.name || 'Проект'}};
  }
  const dest = VOICE_DEST.find(d => d[2].test(lo));
  // Название проекта целиком — это проект; по основам слов проект уступает разделу («покажи смету ремонта» — это смета, а не проект «Двушка Ремонт»)
  if (best && (best.score >= 100 || !dest || dest[0] === 'deals')) return best.nav;
  if (dest) return {kind: 'dest', id: dest[0], label: dest[1]};
  return null;
}

/* ===== Расчёт сделки ===== */
function calcTax(c, x) {
  if (c.tax === 'none') return 0;
  if (c.tax === 'usn6') return c.sale * 0.06;
  if (c.tax === 'usn15') {
    const base = c.sale - (c.price + c.buyCosts + c.repair + c.furniture + x.util + x.interest + x.comm);
    return Math.max(base * 0.15, c.sale * 0.01);
  }
  // НДФЛ физлица: доход не ниже 70% кадастровой; вычет — расходы на покупку или 1 млн
  const income = Math.max(c.sale, c.cadastral > 0 ? c.cadastral * 0.7 : 0);
  const exp = c.price + c.buyCosts + (c.repairDed ? c.repair : 0);
  const base = Math.max(0, income - Math.max(exp, 1000000));
  return base <= 2400000 ? base * 0.13 : 2400000 * 0.13 + (base - 2400000) * 0.15;
}
function compute(c) {
  const m = Math.max(1, Math.round(c.months));
  const loan = c.fin === 'mortgage' ? Math.max(0, c.price * (1 - c.down / 100)) : 0;
  let bal = loan, interest = 0, pmt = 0, payments = 0;
  if (loan > 0) {
    const r = c.rate / 1200, n = Math.max(1, c.term * 12);
    pmt = r > 0 ? loan * r / (1 - Math.pow(1 + r, -n)) : loan / n;
    // Платим, только пока кредит не погашен: срок проекта бывает дольше срока кредита
    payments = Math.min(m, Math.ceil(n));
    for (let i = 0; i < payments; i++) { const it = bal * r; interest += it; bal -= (pmt - it); }
    if (bal < 0) bal = 0;
  }
  const comm = c.sale * c.commission / 100;
  const util = c.utilities * m;
  const ownCash = (c.price - loan) + c.buyCosts + c.repair + c.furniture + util + pmt * payments;
  const costs = c.price + c.buyCosts + c.repair + c.furniture + util + interest + comm;
  const pbt = c.sale - costs;
  const tax = calcTax(c, {interest, comm, util});
  const net = pbt - tax;
  const roi = ownCash > 0 ? net / ownCash * 100 : 0;
  const annual = roi * 12 / m;
  return {m, loan, pmt, interest, bal, comm, util, ownCash, costs, pbt, tax, net, roi, annual};
}
// Поиск значения методом деления пополам (функция монотонна)
function solve(fn, lo, hi, target) {
  let flo = fn(lo) - target; const fhi = fn(hi) - target;
  if (flo === 0) return lo;
  if (flo * fhi > 0) return null;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2, fm = fn(mid) - target;
    if ((fm > 0) === (flo > 0)) { lo = mid; flo = fm; } else hi = mid;
  }
  return (lo + hi) / 2;
}

    ['Ремонт +20%', {repair: c.repair * 1.2}],

  ].map(([name, d]) => ({name, r: compute(Object.assign({}, c, d))}));
  const worst = scen[scen.length - 1].r;
  // Верхняя граница от затрат: ответ не зависит от текущей цены продажи
  const breakeven = solve(s => compute(Object.assign({}, c, {sale: s})).net, 0, Math.max(c.sale, base.costs) * 3 + 1e6, 0);
  const maxBuyYield = c.sale > 0 ? solve(p => compute(Object.assign({}, c, {price: p})).annual, 1, c.sale, c.target) : null;

  const wantProfit = c.minProfit > 0;

  } else if (base.annual >= c.target && !profitShort && worst.net >= 0) {

  } else if (maxBuy && maxBuy > 0 && maxBuy < c.price) {

    why = base.annual < c.target || profitShort
      ? 'При текущей цене ' + [base.annual < c.target ? 'доходность ' + pct(base.annual) + ' годовых — ниже цели ' + pct(c.target) : '', profitShort ? 'чистая прибыль ' + rub(base.net) + ' — ниже желаемой ' + rub(c.minProfit) : ''].filter(Boolean).join(', ') + '. ' + (base.annual < c.target && profitShort ? 'Обе цели достигаются' : 'Цель достигается') + ' при покупке не дороже ' + rub(round10k(maxBuy)) + '.'
      : 'Цель по доходности выполнена, но в плохом сценарии сделка уходит в минус. Безопаснее сбить цену до ' + rub(round10k(maxBuy)) + ' или ниже.';
  } else if (base.net > 0 && worst.net < 0) {
    kind = 'risky'; verdict = 'Рискованно'; cls = 'warn';
    why = 'Сделка в плюсе, но в плохом сценарии (продажа −10%, срок +3 мес., ремонт +20%) уходит в минус.' +
      (profitShort ? ' Чистая прибыль ' + rub(base.net) + ' ниже желаемой ' + rub(c.minProfit) + ', и при такой продаже и расходах желаемая прибыль недостижима ни при какой цене покупки.' : '');
  } else {
    kind = 'skip'; verdict = 'Не брать'; cls = 'bad';
    why = base.net <= 0 ? 'Сделка убыточна при текущих цифрах.'
      : profitShort && base.annual >= c.target ? 'Чистая прибыль ' + rub(base.net) + ' ниже желаемой ' + rub(c.minProfit) + '. При такой цене продажи и расходах желаемая прибыль недостижима ни при какой цене покупки.'
      : 'Доходность ниже цели даже при сильном торге.';
  }
  return {base, scen, breakeven, maxBuy, maxBuyYield, maxBuyProfit, idle, verdict, cls, why, kind};
}

/* ===== Стресс-тест: срок × цена продажи ===== */
const STRESS_MONTHS = [2, 4, 6, 9, 12], STRESS_CUTS = [0, 5, 10];
function stressGrid(c) {
  const m0 = Math.max(1, Math.round(c.months));
  const at = (m, cut) => compute(Object.assign({}, c, {months: m, sale: c.sale * (1 - cut / 100)}));
  const months = [...new Set(STRESS_MONTHS.concat(m0))].sort((a, b) => a - b);
  const rows = months.map(m => ({m, plan: m === m0, cells: STRESS_CUTS.map(cut => at(m, cut))}));
  // Предельный срок без убытка при плановой цене: -1 — уже в минусе, null — не наступает и за 120 месяцев
  let maxMonths;
  if (at(m0, 0).net < 0) maxMonths = -1;
  else {
    maxMonths = null;
    for (let m = m0 + 1; m <= 120; m++) { if (at(m, 0).net < 0) { maxMonths = m - 1; break; } }
  }
  // Цена продажи, при которой прибыль нулевая, и на сколько процентов она ниже плановой
  const be = solve(s => compute(Object.assign({}, c, {sale: s})).net, 0, Math.max(c.sale, compute(c).costs) * 3 + 1e6, 0);
  const cut = be != null && c.sale > 0 ? (1 - be / c.sale) * 100 : null;
  // Если лишний месяц ничего не стоит (нет коммуналки и процентов), срок на прибыль не влияет
  const flat = at(120, 0).net === at(m0, 0).net;
  return {m0, rows, maxMonths, flat, beSale: be, beCut: cut};
}
function stressGridHtml(c) {
  if (!(c.price > 0 && c.sale > 0)) return '';
  const g = stressGrid(c);
  let h = '<div class="card"><h3>Срок и цена продажи</h3><p class="small muted" style="margin-top:0">Чистая прибыль, если квартира продастся за другой срок или дешевле плана.</p>' +
    '<table class="stg"><tr><th>Срок</th>' + STRESS_CUTS.map(x => '<th class="n">' + (x ? 'Цена −' + x + '%' : 'По плану') + '</th>').join('') + '</tr>' +
    g.rows.map(r => '<tr' + (r.plan ? ' class="planrow"' : '') + '><td>' + r.m + ' мес.' + (r.plan ? '<br><span class="small muted">ваш срок</span>' : '') + '</td>' +
      r.cells.map(x => '<td class="n ' + (x.net < 0 ? 'neg' : '') + '">' + rub(x.net) + '</td>').join('') + '</tr>').join('') + '</table>';
  h += '<div class="kpis" style="margin:12px 0 0">' +
    '<div class="kpi"><span>Прибыль в ноль при сроке</span><b>' + (g.maxMonths === -1 ? 'уже в минусе' : g.flat ? 'срок не влияет' : g.maxMonths == null ? 'дольше 10 лет' : g.maxMonths + ' мес.') + '</b></div>' +
    '<div class="kpi"><span>Прибыль в ноль при цене продажи</span><b>' + (g.beSale != null ? rub(g.beSale) + (g.beCut != null && g.beCut > 0 ? ' (−' + g.beCut.toFixed(1).replace('.', ',') + '%)' : '') : '—') + '</b></div></div>';
  return h + '<p class="note">Ориентир по рынку: на вторичке Москвы в 2026 году квартиры продаются за 1–1,5 месяца, а торг в среднем около 5% (по новостным данным, не официальная статистика). Свой срок и цену задавайте по объявлениям рядом.</p></div>';
}

/* ===== Три сценария: оптимист, реалист, пессимист ===== */
function scenValid(sc) {
  return !!sc && Object.keys(SCEN_RANGE).every(k => { const n = Number(sc[k]); return isFinite(n) && n >= SCEN_RANGE[k][0] && n <= SCEN_RANGE[k][1]; });
}
function scenTriple(c, sc) {
  const dm = Math.round(sc.months), ds = sc.sale / 100, dr = sc.repair / 100, m0 = Math.max(1, Math.round(c.months));
  const mk = (name, cls, sale, repair, months) => ({name, cls, sale, repair, months, r: compute(Object.assign({}, c, {sale, repair, months}))});
  return [
    mk('Оптимист', 'opt', c.sale * (1 + ds), c.repair * (1 - dr), Math.max(1, m0 - dm)),
    mk('Реалист', 'real', c.sale, c.repair, m0),
    mk('Пессимист', 'pess', c.sale * (1 - ds), c.repair * (1 + dr), m0 + dm)
  ];
}
function scenTableHtml(c) {
  if (!scenValid(S.scen)) return '<p class="small" style="color:var(--bad);margin:8px 0 0">Отклонения: цена продажи 0–30%, ремонт 0–50%, срок 0–12 мес.</p>';
  const t = scenTriple(c, S.scen), mo = x => String(Math.round(x * 10) / 10).replace('.', ',') + ' мес.';
  const verdict = r => r.net < 0 ? ['убыток', 'neg'] : r.annual >= c.target && !(c.minProfit > 0 && r.net < c.minProfit) ? ['цель', 'pos'] : ['ниже цели', ''];
  return '<table class="stg scen"><tr><th></th>' + t.map(x => '<th class="n">' + x.name + '</th>').join('') + '</tr>' +

/* ===== Свод расходов по комнатам ===== */
function roomTotals(d) {
  const by = {}, exp = (d.expenses || []).filter(e => e && e.sum > 0);
  exp.forEach(e => { const r = cleanRoom(e.room) || ''; const o = by[r] || (by[r] = {room: r, sum: 0, n: 0}); o.sum += e.sum; o.n++; });
  const total = exp.reduce((x, e) => x + e.sum, 0);
  const rows = Object.keys(by).map(k => by[k]).sort((a, b) => (a.room === '') - (b.room === '') || b.sum - a.sum).map(o => Object.assign(o, {share: total > 0 ? o.sum / total * 100 : 0}));
  return {rows, total, tagged: rows.some(r => r.room !== '')};
}
function roomCardHtml(d) {
  const t = roomTotals(d);
  if (!t.rows.length) return '';
  const top = Math.max.apply(null, t.rows.map(r => r.sum));
  const pc = v => (Math.round(v * 10) / 10 + '').replace('.', ',') + '%';
  return '<div class="card"><h3>Расходы по комнатам</h3>' +
    t.rows.map(r => '<div class="rmrow"><div class="rml"><span>' + esc(r.room || 'Без комнаты') + '</span><b>' + rub(r.sum) + '</b></div>' +
      '<div class="rmbar" aria-hidden="true"><i style="width:' + (top > 0 ? Math.max(2, r.sum / top * 100) : 0).toFixed(1) + '%' + (r.room ? '' : ';background:var(--line)') + '"></i></div>' +
      '<div class="small muted">' + pc(r.share) + ' от всех расходов · записей: ' + r.n + '</div></div>').join('') +
    '<div class="kz-sum"><span>Всего</span><b>' + rub(t.total) + '</b></div>' +
    (t.tagged ? '' : '<p class="small muted" style="margin:8px 0 0">Комнаты в расходах пока не отмечены. Выбирайте комнату при добавлении расхода, и здесь появится разбивка.</p>') + '</div>';
}

/* ===== Итоги по всем сделкам ===== */
function portfolio(deals) {
  deals = deals.filter(d => !d.demo);   // учебный пример в итоги не входит
  const out = {n: 0, watch: 0, active: 0, sold: 0, invested: 0, forecast: 0, factProfit: 0, annualAvg: null, best: null, worst: null};
  const annuals = [];
  deals.forEach(d => {
    const p = dealPlan(d), c = Object.assign({}, DEFAULT_CALC, d.calc || {});
    const spent = (d.expenses || []).reduce((s, e) => s + e.sum, 0);
    const sold = d.saleFact > 0 && !!d.calc;   // без расчёта цену покупки не знаем: факт был бы выдуманным
    if (!p && !sold && !spent) return;
    out.n++;
    let res = null;
    if (sold) {
      out.sold++;
      res = d.saleFact - d.saleFact * c.commission / 100 - c.price - spent;
      out.factProfit += res;
    } else if (d.stage === 'Закрыта') {
      return;
    } else if (STAGES.indexOf(d.stage) < STAGES.indexOf('Покупка')) {
      // Поиск и проверка: объект не куплен, деньги не вложены, прибыль не ждём; считаем только траты
      out.watch++;
      out.invested += spent;
    } else {
      out.active++;
      out.invested += (p ? c.price : 0) + spent;
      if (p) { res = dealForecast(d, p, c).fore; out.forecast += res; annuals.push(p.annual); }
    }
    if (res != null) {
      if (!out.best || res > out.best.res) out.best = {name: d.name, res};
      if (!out.worst || res < out.worst.res) out.worst = {name: d.name, res};
    }
  });
  if (annuals.length) out.annualAvg = annuals.reduce((a, b) => a + b, 0) / annuals.length;
  return out;
}
function portfolioHtml(deals) {
  const t = portfolio(deals);
  if (!t.n) return '';
  const row = (l, v, cls) => '<div class="kpi"><span>' + l + '</span><b' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</b></div>';
  const both = t.best && t.worst && t.best.name !== t.worst.name;
  return '<div class="card"><h3>Итоги по сделкам</h3><div class="kpis" style="margin:0">' +
    row('Сделок в работе', t.active) +
    (t.watch ? row('Присматриваем (не куплены)', t.watch) : '') +
    row('Вложено в работающие', rub(t.invested)) +
    row('Ждём прибыли с работающих', rub(t.forecast), t.forecast < 0 ? 'neg' : '') +
    (t.sold ? row('Получено с проданных (' + t.sold + ')', rub(t.factProfit), t.factProfit < 0 ? 'neg' : '') : '') +
    (t.annualAvg != null ? row('Доходность работающих по плану', pct(t.annualAvg) + ' годовых') : '') +
    (both ? row('Лучшая', esc(t.best.name || 'Без названия') + ' · ' + rub(t.best.res)) + row('Слабая', esc(t.worst.name || 'Без названия') + ' · ' + rub(t.worst.res), t.worst.res < 0 ? 'neg' : '') : '') +
    '</div><p class="note">Работающие — прогноз после налога по расчёту; проданные — факт до налога, с комиссией.</p></div>';
}

// Дата «ГГГГ-ММ-ДД» → номер дня (UTC, без часовых поясов); неверная дата → null

}

  const f = e.target.files && e.target.files[0], nm = $('#xChkName');
  if (!f) { XS.chk = null; if (nm) nm.textContent = ''; return; }
  const ext = docExt(f.name) || (/^image\//.test(f.type) ? 'jpg' : '');
  if (!CHK_EXT.includes(ext)) { toast('Нужен PDF или фото'); e.target.value = ''; XS.chk = null; if (nm) nm.textContent = ''; return; }
  if (f.size > DOC_LIMIT) { toast('Файл больше 15 МБ'); e.target.value = ''; XS.chk = null; if (nm) nm.textContent = ''; return; }
  XS.chk = f; if (nm) nm.textContent = 'Приложен: ' + safeFileName(f.name);

$('#report').addEventListener('click', e => {

// Системное меню «Поделиться» (iPhone, Android); где его нет — копируем текст
function shareDeal(d) {
  const p = dealPlan(d), spent = (d.expenses || []).reduce((s, e) => s + e.sum, 0);
  const text = [d.name, d.address, 'Этап: ' + d.stage, p ? 'План: прибыль ' + rub(p.net) + ', ' + pct(p.annual) + ' годовых' : '', 'Потрачено: ' + rub(spent), (wp => wp && wp.shift > 0 ? 'Ремонт: срок сдвинут на ' + wp.shift + ' дн.' : '')(d.works ? worksPlan(d.works, today()) : null)].filter(Boolean).join('\n');
  const data = {title: d.name, text};
  if (/^https?:\/\//i.test(d.link || '')) data.url = d.link;
  const all = text + (data.url ? '\n' + data.url : '');
  const copy = () => navigator.clipboard
    ? navigator.clipboard.writeText(all).then(() => toast('Скопировано — вставьте в мессенджер'), () => toast('Не получилось скопировать'))
    : toast('Поделиться здесь не получится');
  if (navigator.share) navigator.share(data).catch(err => { if (!err || err.name !== 'AbortError') copy(); });
  else copy();
}
function dealLinkHtml(d) {
  return d.link && /^https?:\/\//i.test(d.link) ? '<a href="' + esc(d.link) + '" target="_blank" rel="noopener" style="color:var(--gold-ink)">Открыть объявление</a>' : '';
}
function dealFactHtml(d) {
  const p = dealPlan(d), c = Object.assign({}, DEFAULT_CALC, d.calc || {});
  const spent = (d.expenses || []).reduce((s, e) => s + e.sum, 0);
  const saleFact = d.saleFact || 0;
  const factProfit = saleFact > 0 ? saleFact - saleFact * c.commission / 100 - c.price - spent : null;
  return factProfit != null ? '<table style="margin-top:10px"><tr><td>Продажа</td><td class="n">' + rub(saleFact) + '</td></tr><tr><td>Комиссия ' + c.commission + '%</td><td class="n neg">' + rub(-saleFact * c.commission / 100) + '</td></tr><tr><td>Покупка</td><td class="n neg">' + rub(-c.price) + '</td></tr><tr><td>Все расходы</td><td class="n neg">' + rub(-spent) + '</td></tr><tr class="total"><td>Прибыль до налога</td><td class="n ' + (factProfit < 0 ? 'neg' : 'pos') + '">' + rub(factProfit) + '</td></tr></table>' +
      (p ? '<p class="note">План до налога был ' + rub(p.pbt) + '.</p>' : '') : '<p class="note">Впишите цену продажи, чтобы увидеть фактическую прибыль. Расходы на сделку при покупке вносите в «Расходы» со статьёй «Оформление сделки».</p>';
}

function rayonData() { return typeof RAYONY !== 'undefined' ? RAYONY : []; }
function rayonById(id) { return rayonData().find(r => r.id === id) || null; }
const normRu = s => String(s == null ? '' : s).toLowerCase().replace(/ё/g, 'е');
function rayonFilter(list, q) {
  const w = normRu(q).trim();
  return w ? list.filter(r => normRu(r.name + ' ' + r.okrug).includes(w)) : list;
}
// Район подставляем, только если он прямо назван в адресе: «р-н Перово» или «Перово район».
// Метро и слово в описании не считаются: станция бывает в соседнем районе, а «д. Перово» — в другой области.
function guessRayon(address, list) {
  const t = normRu(address);
  if (/област|обл\.|край|респ\.|республик/.test(t)) return '';
  const hit = (list || rayonData()).find(r => {
    const n = normRu(r.name).replace(/\s+/g, '[\\s-]+');
    return new RegExp('(^|[^а-я])(р-н|р-он|район)\\s+' + n + '($|[^а-я])').test(t) || new RegExp('(^|[^а-я])' + n + '\\s+(р-н|р-он|район)($|[^а-я])').test(t);
  });
  return hit ? hit.id : '';
}
function phoneHref(p) { return /^\+7\d{10}$/.test(p || '') ? 'tel:' + p : ''; }
function phoneText(p) {
  if (!phoneHref(p)) return '';
  const m = p.match(/^\+7(\d{3})(\d{3})(\d{2})(\d{2})$/);
  return (m[1] === '800' ? '8' : '+7') + ' (' + m[1] + ') ' + m[2] + '-' + m[3] + '-' + m[4];

// С координатами — маршрут до точки; без них — поиск адреса на карте

  return 'https://yandex.ru/maps/?text=' + encodeURIComponent(it.n + ', ' + (OUTSIDE_MOSCOW.test(it.a) ? '' : 'Москва, ') + it.a);

function rayonSearchUrl(what, r) { return 'https://yandex.ru/maps/?text=' + encodeURIComponent(what + ', район ' + r.name + ', Москва'); }

// Абзац для объявления: только отмеченные места и без расстояний, которых нет в данных

/* ===== Стиль оформления ===== */
// Оформление: светлый (по умолчанию), жидкое стекло и три темы из заметки «Дизайн, в.2»
const STYLES = [['light', 'Светлый', '#F6F7FA'], ['glass', 'Жидкое стекло', '#05070F'], ['terra', 'Тёплый: терракота', '#F4F1EA'], ['emerald', 'Изумруд и золото', '#14171A'], ['indigo', 'Индиго', '#F8F9FA']];
const cleanStyle = v => STYLES.some(x => x[0] === v) ? v : 'light';
const curStyle = () => cleanStyle(document.documentElement.getAttribute('data-style'));
// Лёгкая вибрация при действии (на iPhone в браузере её нет — тогда ничего не происходит)
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 15); } catch (e) {} }
// Режим «яркий свет»: чёрное на белом, толстые рамки; принудительно светлый стиль
function applyContrast(on) {
  try { localStorage.setItem('fl-contrast', on ? '1' : '0'); } catch (e) {}
  const r = document.documentElement;
  if (on) { r.setAttribute('data-contrast', 'high'); r.setAttribute('data-style', 'light'); }
  else { r.removeAttribute('data-contrast'); let st = 'light'; try { st = cleanStyle(localStorage.getItem('fl-style')); } catch (e) {} r.setAttribute('data-style', st); }
  document.querySelectorAll('#contrastSeg button').forEach(x => { const o = (x.dataset.v === '1') === !!on; x.classList.toggle('on', o); x.setAttribute('aria-pressed', String(o)); });
}

/* ===== Голосовой ввод =====
   Распознавание речи делает сам браузер (Web Speech API). Там, где его нет, подсказываем микрофон на клавиатуре. */
const VOICE = {rec: null, el: null, btn: null, st: null, closing: null, flush: null};
const speechApi = () => (typeof window !== 'undefined' && window && (window.SpeechRecognition || window.webkitSpeechRecognition)) || null;
function voiceErr(code) {
  if (code === 'aborted') return '';
  if (code === 'not-allowed' || code === 'service-not-allowed') return 'Нет доступа к микрофону. Разрешите его для сайта в настройках браузера.';
  if (code === 'no-speech') return 'Речь не слышно. Нажмите «Диктовать» и скажите ещё раз.';
  if (code === 'audio-capture') return 'Микрофон не найден.';
  if (code === 'network') return 'Для распознавания речи нужен интернет.';
  return 'Не получилось распознать речь. Попробуйте ещё раз.';
}
function voiceUi(on, msg) {
  const b = VOICE.btn;
  if (b) { b.classList.toggle('rec', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); const sp = b.querySelector('span'); if (sp) sp.textContent = on ? 'Остановить' : 'Диктовать'; }
  if (VOICE.st) VOICE.st.textContent = msg || '';
}
// Остановка: кнопку возвращаем сразу, но последнюю фразу ещё принимаем — браузер присылает её уже после stop(), до события onend
function voiceStop() {
  const r = VOICE.rec; VOICE.rec = null;
  if (r) { VOICE.closing = r; try { r.stop(); } catch (e) { VOICE.closing = null; } }
  voiceUi(false, '');
}
// Перед чтением текста из поля (сохранение) ждём последнюю фразу, но не дольше 0,8 с
function voiceFlush() {
  if (!VOICE.closing) return Promise.resolve();
  return new Promise(res => {
    const done = () => { clearTimeout(t); VOICE.flush = null; VOICE.closing = null; res(); };
    const t = setTimeout(done, 800);
    VOICE.flush = done;
  });
}
// Нажатие на кнопку «Диктовать»: включает или выключает запись в поле el (st — строка статуса)
function voiceToggle(el, btn, st) {
  if (VOICE.rec && VOICE.btn === btn) { voiceStop(); return; }
  voiceStop();
  const R = speechApi();
  if (!R) { toast('Голосовой ввод не работает в этом браузере. Нажмите значок микрофона на клавиатуре телефона.'); return; }
  let rec;
  try { rec = new R(); } catch (e) { toast('Не удалось включить микрофон'); return; }
  rec.lang = 'ru-RU'; rec.continuous = true; rec.interimResults = true;
  VOICE.rec = rec; VOICE.el = el; VOICE.btn = btn; VOICE.st = st;
  rec.onresult = ev => {
    const live = VOICE.rec === rec;
    if (!live && VOICE.closing !== rec) return;
    let fin = '', interim = '';
    for (let i = ev.resultIndex || 0; i < ev.results.length; i++) {
      const r = ev.results[i], t = (r && r[0] && r[0].transcript) || '';
      if (r && r.isFinal) fin += t; else interim += t;
    }
    if (fin.trim()) {
      el.value = (String(el.value).replace(/\s+$/, '') + ' ' + fin.trim()).trim().slice(0, 2000);
      el.dispatchEvent(new Event('input', {bubbles: true}));
    }
    if (st && live) st.textContent = interim ? 'Слышу: ' + interim : 'Говорите…';
  };
  rec.onerror = ev => { if (VOICE.rec !== rec) return; VOICE.rec = null; voiceUi(false, voiceErr(ev && ev.error)); };
  rec.onend = () => {
    if (VOICE.rec === rec) { VOICE.rec = null; voiceUi(false, ''); }
    if (VOICE.closing === rec) { VOICE.closing = null; if (VOICE.flush) VOICE.flush(); }
  };
  try { rec.start(); voiceUi(true, 'Говорите…'); }
  catch (e) { VOICE.rec = null; voiceUi(false, 'Не удалось включить микрофон'); }
}

/* ===== Контакты: адреса и телефоны, подрядчики; ввод голосом ===== */
const CT = {q: '', role: '', deal: '', form: null, st: ''};
function normPhone(raw) {
  const d = String(raw == null ? '' : raw).replace(/\D/g, '');
  const f = x => '+7 ' + x.slice(0, 3) + ' ' + x.slice(3, 6) + '-' + x.slice(6, 8) + '-' + x.slice(8);
  // Белорусский формат «8 0XX …» не трогаем: в России после 8 никогда не идёт 0
  if (d.length === 11 && d.slice(0, 2) !== '80' && (d[0] === '8' || d[0] === '7')) return f(d.slice(1));
  if (d.length === 10) return f(d);
  if (d.length === 12 && d.startsWith('375')) return '+375 ' + d.slice(3, 5) + ' ' + d.slice(5, 8) + '-' + d.slice(8, 10) + '-' + d.slice(10);
  return String(raw == null ? '' : raw).replace(/[^0-9+()\-\s.]/g, '').trim().slice(0, 30);
}
// Телефоны в тексте: 10–12 цифр подряд с пробелами, скобками, точками и дефисами; ИНН, счета и даты за телефон не считаются
function findPhones(text) {
  const out = [], re = /(?:\+?\d[\s\-().]*){10,12}/g; let m;
  const t = String(text == null ? '' : text);
  while ((m = re.exec(t))) {
    const d = m[0].replace(/\D/g, '');
    if (d.length < 10 || d.length > 12 || (d.length === 12 && !d.startsWith('375'))) continue;
    if (/^\d{1,2}[.\s]\d{1,2}[.\s]\d{4}/.test(m[0].trim())) continue;
    if (/(инн|огрн|кпп|бик|счет|счёт)\s*[:№N#]?\s*$/i.test(t.slice(Math.max(0, m.index - 12), m.index))) continue;
    out.push({raw: m[0].trim(), norm: normPhone(m[0]), from: m.index, to: m.index + m[0].length});
  }
  return out;
}
const CT_ROLE_WORDS = [
  ['Электрик', /электрик/], ['Сантехник', /сантехник/], ['Плиточник', /плиточник|кафельщик/], ['Маляр', /маляр|штукатур/],

// Фраза → черновик контакта: «Иван электрик 8 903 123 45 67 Москва Кузьминки» → имя, роль, телефон, адрес
function parseContact(raw) {
  let t = String(raw == null ? '' : raw).replace(/[\u00a0\u202f]/g, ' ').replace(/\s+/g, ' ').trim();
  const out = {name: '', role: '', phone: '', phone2: '', company: '', address: '', note: ''};
  if (!t) return out;
  t = t.replace(/^(добав\S*|запиш\S*|сохран\S*|созда\S*|нов\S*)\s+(?:(?:новый|нового|новое)\s+)?(контакт\S*|подрядчик\S*|мастер\S*|телефон\S*|номер\S*)?\s*/i, '');
  const ph = findPhones(t);
  if (ph[0]) out.phone = ph[0].norm;
  if (ph[1]) out.phone2 = ph[1].norm;
  let rest = t;
  for (let i = ph.length - 1; i >= 0; i--) rest = rest.slice(0, ph[i].from) + ' ' + rest.slice(ph[i].to);
  rest = rest.replace(/\s+/g, ' ').trim();
  const am = /(^|\s)(по адресу|адрес[а-я]*|живет|находится|на улице|улица|ул\.?|проспект|пр-т|переулок|шоссе|бульвар|набережная|город|г\.|москва|московская область|подмосковье)(?=\s|$|[.,])/i.exec(rest);

    rest = rest.slice(0, am.index).trim();

  }
  words = words.filter(w => !CT_STOP.test(normRu(w).replace(/[.,]/g, '')));

  return out;
}

/* ===== Юридический справочник: шаблоны документов для флиппинга =====
   Тексты лежат в shablony-data.js (справочные образцы). Подстановка данных идёт только в памяти страницы: паспорта и адреса нигде не сохраняются. */
const shablony = () => typeof SHABLONY !== 'undefined' ? SHABLONY : [];
const DS = {q: '', group: '', open: '', vals: {}, deal: ''};
// Подставляет значения в {{поля}}; незаполненные остаются как есть (видно, что осталось вписать)
function tplFill(body, vals) {
  return String(body == null ? '' : body).replace(/\{\{([^{}\n]{1,60})\}\}/g, (m, k) => { const v = vals && vals[m]; return v != null && String(v).trim() ? String(v) : m; });
}

function tplFromDeal(d) {
  const v = {'{{дата}}': tplRuDate(new Date())};
  if (d) { if (d.address) v['{{адрес_объекта}}'] = d.address; if (d.owner && d.owner.name) v['{{продавец_фио}}'] = d.owner.name; }
  return v;
}
function lgFilter(list, q, group) {
  const k = normRu(q).trim();
  return list.filter(d => (!group || d.group === group) && (!k || normRu([d.title, d.when, d.group, d.where, d.form].join(' ')).includes(k)));
}
function lgText(d) { return tplFill(d.body, DS.vals[d.id] || {}); }
function lgDownload(d, kind) {
  const text = lgText(d), name = String(d.id).replace(/[^a-z0-9-]/gi, '') || 'dokument';
  let blob, ext;
  if (kind === 'doc') {
    blob = new Blob(['\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(d.title) + '</title></head><body><pre style="font-family:\'Times New Roman\',serif;font-size:12pt;white-space:pre-wrap">' + esc(text) + '</pre></body></html>'], {type: 'application/msword'});
    ext = 'doc';
  } else { blob = new Blob(['\ufeff' + text], {type: 'text/plain;charset=utf-8'}); ext = 'txt'; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');

/* ===== Записная книжка =====

const BK = {text: '', deal: '', q: '', f: '', edit: '', etext: '', dtext: '', busy: false, mode: 'notes'};
const bkFmt = ts => { const d = new Date(ts); return isNaN(d) ? '' : two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()); };
const bkSort = (a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || b.ts - a.ts;

  S.book.push({id: uid(), text: t, ts: Date.now(), dealId: dealId && S.deals.some(x => x.id === dealId) ? dealId : '', pin: false});
  if (!save()) { S.book.pop(); return false; }

}

// Телефон для ссылки «Позвонить»: российский формат приводим к +7, короткие номера оставляем как есть
function telHref(phone) {
  const raw = String(phone || '').trim(); let d = raw.replace(/\D/g, '');
  if (d.length < 5 || d.length > 15) return '';
  if (raw.startsWith('+')) return 'tel:+' + d;
  if (d.length === 11 && d.startsWith('80')) return 'tel:+375' + d.slice(2);   // белорусский формат 8 0XX XXX-XX-XX
  if (d.length === 11 && (d[0] === '8' || d[0] === '7')) return 'tel:+7' + d.slice(1);

const taxiUrl = (lat, lon) => 'https://3.redirect.appmetrica.yandex.com/route?end-lat=' + lat.toFixed(6) + '&end-lon=' + lon.toFixed(6) + '&appmetrica_tracking_id=1178268795219780156&lang=ru';

async function geocodeAddress(address) {
  const q = String(address || '').trim();
  if (!q) return null;
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, t = setTimeout(() => { if (ctl) ctl.abort(); }, 10000);
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ru&countrycodes=ru,by,kz&q=' + encodeURIComponent(q), {signal: ctl ? ctl.signal : undefined});
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(), x = Array.isArray(j) ? j[0] : null;
    if (!x) return null;
    const lat = Number(x.lat), lon = Number(x.lon);
    const name = String(x.display_name || '').split(',').slice(0, 4).map(v => v.trim()).filter(Boolean).join(', ');
    return hasCoord(lat, lon) ? {lat, lon, name} : null;
  } finally { clearTimeout(t); }
}

/* ===== Подсказка «Установить на экран Домой» ===== */
let installEvt = null;  // предложение установки от Chrome/Android
const UA = navigator.userAgent || '';
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);  // iPadOS выдаёт себя за Mac
const inApp = !!window.TelegramWebviewProxy || /Telegram|FBAN|FBAV|Instagram/i.test(UA);  // встроенные браузеры: «На экран Домой» там нет
const HIDE_KEY = 'flipologia-hide-install';
function installHidden() { try { return localStorage.getItem(HIDE_KEY) === '1'; } catch (e) { return false; } }
const standalone = navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function showInstall() {
  if (standalone || installHidden()) return;
  let h;
  if (isIOS && inApp) h = 'Чтобы установить Флипологию как приложение, откройте эту страницу в <b>Safari</b> (меню ⋯ → «Открыть в Safari»), затем ' + SHARE_ICON + ' <b>«Поделиться»</b> → <b>«На экран Домой»</b>.';
  else if (isIOS) h = 'Установите Флипологию как приложение: нажмите ' + SHARE_ICON + ' <b>«Поделиться»</b>, затем <b>«На экран Домой»</b>.';
  else if (installEvt) h = 'Установите Флипологию на телефон — будет открываться как приложение, без браузера.<br><button class="btn pri" data-i="install">Установить</button>';
  else return;
  const el = $('#install');
  el.innerHTML = h + '<button class="x" data-i="close" aria-label="Закрыть">×</button>';
  el.classList.remove('hide'); document.body.classList.add('has-install');
}
$('#install').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  if (b.dataset.i === 'install' && installEvt) { installEvt.prompt(); installEvt = null; }
  try { localStorage.setItem(HIDE_KEY, '1'); } catch (err) {}
  $('#install').classList.add('hide'); document.body.classList.remove('has-install');
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
setTimeout(showInstall, 1500);
