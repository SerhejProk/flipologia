<title>Флипология</title>
<style>
@font-face{font-family:'Golos Text';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/golos-400.ttf) format('truetype')}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/golos-600.ttf) format('truetype')}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/golos-800.ttf) format('truetype')}
/* стиль «Светлый минимализм»: воздух, белые карточки без рамок, один синий акцент, цифра — главный герой */
:root{
  --bg:#F6F7FA; --card:#FFFFFF; --ink:#14171C; --muted:#6B7280; --line:#E9ECF1;
  --dark:#14171C; --dark-ink:#FFFFFF; --gold:#0A63FF; --gold-ink:#0A63FF; --acc-soft:#E8F0FF;
  --good:#12875A; --good-bg:#E4F5EC; --warn:#A35F00; --warn-bg:#FDF1D8; --bad:#D6343B; --bad-bg:#FCE7E8;
  --input:#F1F3F7; --shadow:0 1px 2px rgba(20,23,28,.05),0 6px 18px rgba(20,23,28,.04);
  --bar:rgba(255,255,255,.82); --bar-line:rgba(20,23,28,.08); --top-bg:rgba(246,247,250,.82);
  --font:'Golos Text',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0D10; --card:#15181D; --ink:#F3F5F7; --muted:#9AA3AE; --line:#232830;
    --dark:#2A2F37; --dark-ink:#F3F5F7; --gold:#3D86FF; --gold-ink:#6BA4FF; --acc-soft:#16233A;
    --good:#4FD39B; --good-bg:#12302A; --warn:#F5C55A; --warn-bg:#352C14; --bad:#FF8A8F; --bad-bg:#3A1B1D;
    --input:#1D2127; --shadow:none;
    --bar:rgba(21,24,29,.82); --bar-line:rgba(243,245,247,.08); --top-bg:rgba(11,13,16,.82);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--top-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:10px}
.top img{width:30px;height:30px;border-radius:8px}
.brand{font-weight:800;letter-spacing:2px;font-size:14px;color:var(--ink);transition:opacity .2s}
.sub{position:absolute;left:64px;right:64px;bottom:0;height:50px;line-height:50px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none}
.top.scrolled .brand{opacity:0}
.top.scrolled .sub{opacity:1}
main{max-width:720px;margin:0 auto;padding:12px 16px 16px;overflow-x:hidden;overflow-x:clip}
body.has-install{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
/* крупный заголовок раздела (Large Title) */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.lt h1{font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.8px;margin:0;overflow-wrap:anywhere}
.lt .btn{flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bar-line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button svg{width:24px;height:24px;transition:transform .12s}
.tabs button:active svg{transform:scale(.88)}
.tabs button.on{color:var(--gold-ink);font-weight:600}
.tabs button.on svg{color:var(--gold-ink)}
h2{font-size:22px;font-weight:600;letter-spacing:-.3px;margin:4px 0 12px}
h3{font-size:16px;font-weight:600;margin:0 0 12px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap span{position:absolute;right:10px;font-size:14px;color:var(--muted);pointer-events:none}
input[type=text],input[type=date],input[type=url],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--input);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-height:46px}
.inwrap input{padding-right:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;background:var(--card)}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;background:var(--input);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:8px 6px;border-radius:8px;min-height:38px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,23,28,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;border-radius:14px;padding:10px 16px;min-height:46px;border:0;background:var(--acc-soft);color:var(--gold-ink);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--gold);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--gold)}
.verdict{text-align:center;padding:18px 8px 6px;margin-bottom:6px}
.verdict .v{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.02em;line-height:1.2;padding:7px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.verdict.good .v{color:var(--good)}
.verdict.warn .v{color:var(--warn)}
.verdict.bad .v{color:var(--bad)}
.verdict .lbl{color:var(--muted);font-size:14px;margin-top:22px}
.verdict .big{font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.verdict .big.neg{color:var(--bad)}
.verdict .sub2{color:var(--muted);font-size:15px}
.verdict .sub2 b{color:var(--ink);font-weight:600}
.verdict.good .sub2 b{color:var(--good)}
.verdict .sub2 b.neg{color:var(--bad)}
.verdict p{margin:12px auto 0;max-width:34em;color:var(--muted);font-size:14px}
.price-slide{padding-bottom:14px}
.price-slide .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price-slide .head span{color:var(--muted);font-size:14px}
.price-slide .head b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.price-slide input[type=range]{width:100%;height:32px;margin:6px 0 0;accent-color:var(--gold)}
.price-slide .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.kpis{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin:0 0 12px}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.kpi:last-child{border-bottom:0}
.kpi span{color:var(--muted)}
.kpi b{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.kpi b.neg{color:var(--bad)}
.stackbar{display:flex;gap:2px;height:14px;border-radius:999px;overflow:hidden}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend u{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0}
.neg{color:var(--bad)} .pos{color:var(--good)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--input);color:var(--muted)}
.pill.st{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.deal{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border:0}
.deal .t{font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--muted);cursor:pointer;min-height:36px}
.chips button.on{background:var(--gold);color:#fff}
details{border-bottom:1px solid var(--line);padding:4px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
b,strong,.deal .t,.place .t{font-weight:600}
details ul{margin:0 0 10px;padding-left:20px}
details li{margin:4px 0}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:10px 18px;border-radius:999px;font-size:14px;z-index:10;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.back{background:none;border:0;font:inherit;color:var(--gold-ink);font-weight:600;padding:6px 0 10px;cursor:pointer}
.lt .back{display:block;font-size:17px;font-weight:500;padding:0 0 4px}
.empty{text-align:center;padding:28px 12px}
.hide{display:none!important}
/* ощущение нативного приложения: без выделения текста на кнопках, отклик на нажатие, переходы экранов */
button,summary,.tabs,.top,.chips,.seg,.lt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn,.deal,.chips button,.seg button{transition:transform .12s,opacity .12s}
.btn:active,.deal:active,.chips button:active{transform:scale(.97);opacity:.85}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes inRight{from{opacity:.3;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inLeft{from{opacity:.3;transform:translateX(-48px)}to{opacity:1;transform:none}}
.anim-up{animation:fadeUp .24s ease-out}
.anim-right{animation:inRight .26s cubic-bezier(.2,.8,.2,1)}
.anim-left{animation:inLeft .26s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.anim-up,.anim-right,.anim-left{animation:none}.btn,.deal,.brand,.sub{transition:none}}
/* подсказка «Установить на экран Домой» */
.install{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:6;max-width:520px;margin:0 auto;background:var(--dark);color:var(--dark-ink);border-radius:20px;padding:12px 44px 12px 14px;font-size:14px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeUp .3s ease-out}
.install b{color:#fff}
.install svg{width:16px;height:16px;vertical-align:-3px;color:#fff}
.install .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;color:var(--dark-ink);font-size:22px;line-height:1;cursor:pointer;opacity:.7}
.install .btn{margin-top:8px;min-height:38px;padding:6px 14px;background:var(--gold);color:#fff}
/* раздел «Районы» */
.place{padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.place:first-of-type{border-top:0;padding-top:2px}
.place .t{font-weight:700;font-size:15px}
.place .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.place .acts .btn{min-height:44px;padding:6px 14px;font-size:14px}
.place details{border:0;padding:0;margin-top:4px}
.place summary{font-size:13px;font-weight:500;color:var(--muted);padding:8px 0}
.place .chk{padding:0 0 4px}
.price-big{font-size:28px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.rseg button{font-size:13px;padding:8px 2px}
.star{width:44px;height:44px;border:0;border-radius:12px;box-shadow:var(--shadow);background:var(--card);color:var(--gold-ink);font-size:22px;line-height:1;cursor:pointer}
.rlink{display:block;padding:9px 0;color:var(--gold-ink);font-weight:600;font-size:14px}
</style>
</head>
<body>
<header class="top" id="top">
  <img src="icon-192.png" alt="">
  <div class="brand">ФЛИПОЛОГИЯ</div>
  <div class="sub" id="sub"></div>
</header>
<main><div class="lt"><div><button class="back hide" id="ltBack" data-a="deal-close">‹ Сделки</button><h1 id="lt"></h1></div><span id="ltAct"></span></div><div id="view"></div></main>
<div class="install hide" id="install"></div>
<nav class="tabs" id="tabs">
  <button data-tab="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>Расчёт</button>
  <button data-tab="smeta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Смета</button>
  <button data-tab="torgi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 12.5l-8 8a2.1 2.1 0 1 1-3-3l8-8"/><path d="M16 16l6-6"/><path d="M8 8l6-6"/><path d="M9 7l8 8"/><path d="M21 11l-8-8"/></svg>Торги</button>
  <button data-tab="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Сделки</button>
  <button data-tab="ref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 8h6M8 12h6"/></svg>Справка</button>
</nav>
<div class="toast" id="toast"></div>

<script src="rayony-data.js"></script>
<script>
'use strict';
/* ===== Настройки и данные по умолчанию ===== */
const LS_KEY = 'flipologia-v1';
const DEFAULT_CALC = {
  price: 5000000, buyCosts: 60000, cadastral: 0,
  repair: 800000, furniture: 100000,
  months: 6, utilities: 7000,
  sale: 7000000, commission: 2,
  fin: 'own', down: 30, rate: 20, term: 20,
  tax: 'ndfl', repairDed: false,
  target: 30,
  torgiExtra: 0, torgiDelay: 0  // сколько расходов и месяцев торгов уже вошло в buyCosts и months
};
const LEVELS = ['Косметика', 'Стандарт', 'Под ключ'];
// Ориентировочные цены «работа + материалы», ₽. Пользователь правит под свой регион.
const SMETA_ITEMS = [
  {k:'demo',    name:'Демонтаж',                     unit:'м²', qty:'area',  p:[400, 700, 900]},
  {k:'elec',    name:'Электрика',                    unit:'м²', qty:'area',  p:[300, 1500, 2500]},
  {k:'walls',   name:'Стены: подготовка и отделка',  unit:'м²', qty:'area',  p:[1200, 2500, 4000]},
  {k:'floor',   name:'Полы: стяжка и покрытие',      unit:'м²', qty:'area',  p:[1200, 2800, 4500]},
  {k:'ceil',    name:'Потолки',                      unit:'м²', qty:'area',  p:[400, 1200, 2000]},
  {k:'bath',    name:'Санузел: плитка и сантехника', unit:'шт', qty:'baths', p:[50000, 130000, 220000]},
  {k:'doors',   name:'Межкомнатные двери',           unit:'шт', qty:'doors', p:[8000, 15000, 25000]},
  {k:'kitchen', name:'Кухонный гарнитур',            unit:'шт', qty:'one',   p:[0, 120000, 250000]},
  {k:'clean',   name:'Вывоз мусора и уборка',        unit:'шт', qty:'one',   p:[15000, 25000, 35000]}
];
const DEFAULT_SMETA = {area: 45, rooms: 2, baths: 1, level: 1, contingency: 10, custom: {}};
const STAGES = ['Поиск', 'Проверка', 'Покупка', 'Ремонт', 'Продажа', 'Закрыта'];

const CALC_ENUMS = {fin: ['own', 'mortgage'], tax: ['ndfl', 'usn6', 'usn15', 'none']};
function clean(def, src, enums) {
  const o = Object.assign({}, def);
  if (!src || typeof src !== 'object') return o;
  Object.keys(def).forEach(k => {
    const v = src[k], d = def[k];
    if (enums && enums[k]) o[k] = enums[k].includes(v) ? v : d;
    else if (typeof d === 'number') { const n = Number(v); o[k] = v != null && isFinite(n) ? n : d; }
    else if (typeof d === 'boolean') o[k] = !!v;
  });
  return o;
}
// Избранные районы и свои пометки: только строки и только допустимые ключи
function cleanRayony(r) {
  const out = {fav: [], notes: {}, dnotes: {}};
  if (!r || typeof r !== 'object') return out;
  if (Array.isArray(r.fav)) out.fav = [...new Set(r.fav.filter(x => typeof x === 'string' && /^[a-z-]{1,30}$/.test(x)))];
  [['notes', /^[a-z0-9]{1,30}$/], ['dnotes', /^[a-z-]{1,30}$/]].forEach(([key, re]) => {
    if (r[key] && typeof r[key] === 'object') Object.keys(r[key]).forEach(k => {
      if (re.test(k) && typeof r[key][k] === 'string' && r[key][k]) out[key][k] = r[key][k].slice(0, 2000);
    });
  });
  return out;
}
function cleanDeal(d) {
  if (!d || typeof d !== 'object') return null;
  const str = v => v == null ? '' : String(v);
  return {

}

/* ===== Расчёт сделки ===== */
function calcTax(c, x) {
  if (c.tax === 'none') return 0;
  if (c.tax === 'usn6') return c.sale * 0.06;
  if (c.tax === 'usn15') {
    const base = c.sale - (c.price + c.buyCosts + c.repair + c.furniture + x.util + x.interest + x.comm);
    return Math.max(base * 0.15, c.sale * 0.01);
  }
  // НДФЛ физлица: доход не ниже 70% кадастровой; вычет — расходы на покупку или 1 млн
  const income = Math.max(c.sale, c.cadastral > 0 ? c.cadastral * 0.7 : 0);
  const exp = c.price + c.buyCosts + (c.repairDed ? c.repair : 0);
  const base = Math.max(0, income - Math.max(exp, 1000000));
  return base <= 2400000 ? base * 0.13 : 2400000 * 0.13 + (base - 2400000) * 0.15;
}
function compute(c) {
  const m = Math.max(1, Math.round(c.months));
  const loan = c.fin === 'mortgage' ? Math.max(0, c.price * (1 - c.down / 100)) : 0;
  let bal = loan, interest = 0, pmt = 0, payments = 0;
  if (loan > 0) {
    const r = c.rate / 1200, n = Math.max(1, c.term * 12);
    pmt = r > 0 ? loan * r / (1 - Math.pow(1 + r, -n)) : loan / n;
    // Платим, только пока кредит не погашен: срок проекта бывает дольше срока кредита
    payments = Math.min(m, Math.ceil(n));
    for (let i = 0; i < payments; i++) { const it = bal * r; interest += it; bal -= (pmt - it); }
    if (bal < 0) bal = 0;
  }
  const comm = c.sale * c.commission / 100;
  const util = c.utilities * m;
  const ownCash = (c.price - loan) + c.buyCosts + c.repair + c.furniture + util + pmt * payments;
  const costs = c.price + c.buyCosts + c.repair + c.furniture + util + interest + comm;
  const pbt = c.sale - costs;
  const tax = calcTax(c, {interest, comm, util});
  const net = pbt - tax;
  const roi = ownCash > 0 ? net / ownCash * 100 : 0;
  const annual = roi * 12 / m;
  return {m, loan, pmt, interest, bal, comm, util, ownCash, costs, pbt, tax, net, roi, annual};
}
// Поиск значения методом деления пополам (функция монотонна)
function solve(fn, lo, hi, target) {
  let flo = fn(lo) - target; const fhi = fn(hi) - target;
  if (flo === 0) return lo;
  if (flo * fhi > 0) return null;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2, fm = fn(mid) - target;
    if ((fm > 0) === (flo > 0)) { lo = mid; flo = fm; } else hi = mid;
  }
  return (lo + hi) / 2;
}
function analyse(c) {
  const base = compute(c);
  const scen = [
    ['Базовый', {}],
    ['Продажа −10%', {sale: c.sale * 0.9}],
    ['Срок +3 мес.', {months: c.months + 3}],
    ['Ремонт +20%', {repair: c.repair * 1.2}],
    ['Всё сразу', {sale: c.sale * 0.9, months: c.months + 3, repair: c.repair * 1.2}]
  ].map(([name, d]) => ({name, r: compute(Object.assign({}, c, d))}));
  const worst = scen[scen.length - 1].r;
  // Верхняя граница от затрат: ответ не зависит от текущей цены продажи
  const breakeven = solve(s => compute(Object.assign({}, c, {sale: s})).net, 0, Math.max(c.sale, base.costs) * 3 + 1e6, 0);
  const maxBuy = c.sale > 0 ? solve(p => compute(Object.assign({}, c, {price: p})).annual, 1, c.sale, c.target) : null;
  let verdict, cls, why;
  if (c.price <= 0 || c.sale <= 0) {
    verdict = 'Заполните цены'; cls = 'warn'; why = 'Нужны цена покупки и ожидаемая цена продажи.';
  } else if (base.annual >= c.target && worst.net >= 0) {
    verdict = 'Брать'; cls = 'good';
    why = 'Доходность ' + pct(base.annual) + ' годовых не ниже цели ' + pct(c.target) + ', и даже в плохом сценарии сделка без убытка.';
  } else if (maxBuy && maxBuy > 0 && maxBuy < c.price) {
    verdict = 'Торговаться до ' + rub(round10k(maxBuy)); cls = 'warn';
    why = base.annual < c.target
      ? 'При текущей цене доходность ' + pct(base.annual) + ' годовых — ниже цели ' + pct(c.target) + '. Цель достигается при покупке не дороже ' + rub(round10k(maxBuy)) + '.'
      : 'Цель по доходности выполнена, но в плохом сценарии сделка уходит в минус. Безопаснее сбить цену до ' + rub(round10k(maxBuy)) + ' или ниже.';
  } else if (base.net > 0 && worst.net < 0) {
    verdict = 'Рискованно'; cls = 'warn';
    why = 'Сделка в плюсе, но в плохом сценарии (продажа −10%, срок +3 мес., ремонт +20%) уходит в минус.';
  } else {
    verdict = 'Не брать'; cls = 'bad';
    why = base.net <= 0 ? 'Сделка убыточна при текущих цифрах.' : 'Доходность ниже цели даже при сильном торге.';
  }
  return {base, scen, breakeven, maxBuy, verdict, cls, why};
}

function priceSlideRange(price) {
  if (!(price > 0)) return null;
  const lo = Math.round(price * 0.6 / 10000) * 10000, hi = Math.round(price * 1.4 / 10000) * 10000;
  return hi > lo ? {lo, hi} : null;
}
function priceSlideHtml(price) {
  const g = priceSlideRange(price);
  if (!g) return '';
  return '<div class="card price-slide"><div class="head"><span>Цена покупки</span><b id="priceVal">' + rub(price) + '</b></div>' +
    '<input type="range" id="priceSlide" min="' + g.lo + '" max="' + g.hi + '" step="10000" value="' + price + '" aria-label="Цена покупки">' +
    '<div class="ends"><span id="priceLo">' + rub(g.lo) + '</span><span id="priceHi">' + rub(g.hi) + '</span></div></div>';
}

/* ===== Разбор текста объявления ===== */
let parseDraft = '';   // текст в поле «Вставить объявление», пока приложение открыто
let lastParse = null;  // что нашли в последний раз
const ROOM_WORDS = {одно: 1, двух: 2, трёх: 3, трех: 3, четырёх: 4, четырех: 4, пяти: 5};
function parseListing(text) {
  const t = String(text).replace(/[\t\u00a0\u2009\u202f]/g, ' ');
  const r = {};
  let m;
  // Цена: сумма от 300 тыс. ₽. Подписанная «Цена» важнее; пропускаем цену за м²,
  // платежи, скидки, взносы и старую цену («было … стало …»)
  const priceRe = /(?<![\d.,])(?:(\d{1,3}(?: \d{3})+|\d{4,})(?:[.,]\d+)? ?(?:₽|руб|р\.)|(\d{1,3}(?: \d{3})*(?:[.,]\d+)?) ?(млн|тыс))/gi;
  const prices = [];
  while ((m = priceRe.exec(t))) {
    const end = m.index + m[0].length;
    const before = t.slice(Math.max(0, m.index - 30), m.index), after = t.slice(end, end + 14);
    if (/^\.?\s*(?:за|\/|в)\s*(?:1\s*)?(?:м|кв|мес)/i.test(after)) continue;
    if (/(скидк|плат[её]ж|было|взнос|залог|доход|комисси|аренд|кэшб[эе]к)[^\n\d]{0,20}$/i.test(before) || /(?<![а-яё])от\s*$/i.test(before)) continue;
    const v = m[1] ? parseNum(m[1]) : parseNum(m[2]) * (/млн/i.test(m[3]) ? 1e6 : 1e3);
    if (v >= 300000) prices.push({v, label: /цена[^\n\d]{0,12}$/i.test(before)});
  }
  const pr = prices.find(p => p.label) || prices[0];
  if (pr) r.price = pr.v;
  // Площадь: из заголовка («2-к. квартира, 54,3 м²»), иначе подписанная «Общая», иначе первая,
  // кроме кухни, жилой и цены за м². Подпись бывает до значения и после него — смотрим, как в тексте.
  const valueFirst = /\d ?(?:м²|м2)\s*общая/i.test(t);
  const areaRe = /(\d+(?:[.,]\d+)?) ?(?:м²|м2|кв\.? ?м)/gi;
  const areas = [];
  while ((m = areaRe.exec(t))) {
    const before = t.slice(Math.max(0, m.index - 25), m.index), after = t.slice(m.index + m[0].length, m.index + m[0].length + 20);
    if (/(?:за|\/)\s*$/i.test(before)) continue;
    const v = parseNum(m[1]); if (v < 8 || v > 1000) continue;
    const other = /(кухн|жил|комнат[ыа]?\s|балкон|лодж)[^\d\n]{0,20}$/i.test(before) || (valueFirst && /^\.?\s*(жил|кухн|площадь кухни)/i.test(after));
    const total = !other && (valueFirst ? /^\.?\s*общая/i.test(after) : /общая[^\d]{0,20}$/i.test(before));
    const title = !other && /(квартир|студи|\d-?\s?комн|апартамент)[^\n]{0,25}$/i.test(before);
    areas.push({v, title, total, other});
  }
  const ar = areas.find(a => a.title) || areas.find(a => a.total) || areas.find(a => !a.other);
  if (ar) r.area = ar.v;
  // Комнаты: «2-к.», «2-комн.», «2к кв», «Количество комнат: 2». Корпус дома («5к1», «5 к. 1») — не комнаты.
  if ((m = t.match(/количество комнат[^\d\n]{0,5}(\d)/i))) r.rooms = Number(m[1]);
  else if ((m = t.match(/(?<![\d.,])(\d)(?:\s*-\s*к\.?(?![а-яё\d])|\s*-?\s*комн|\s?к\.?\s+кв)/i))) r.rooms = Number(m[1]);
  else if ((m = t.match(/(одно|двух|тр[её]х|четыр[её]х|пяти)комнатн/i))) r.rooms = ROOM_WORDS[m[1].toLowerCase()];
  else if (/(?:^|\n)\s*студи|квартира-студи|комнат[^\n]{0,5}студи|студия,\s*\d/i.test(t)) { r.rooms = 1; r.studio = true; }
  m = t.match(/(\d{1,2}) ?\/ ?(\d{1,3}) ?эт/i) || t.match(/этаж\D{0,3}(\d{1,2})\D{1,5}(\d{1,3})/i);
  if (m) { r.floor = Number(m[1]); r.floors = Number(m[2]); }
  // Адрес: строка с улицей или городом; с номером дома или «Москва» — важнее
  const lines = t.split(/\n/).map(s => s.trim()).filter(Boolean);
  const addrRe = /(?<![а-яё])(москва|московская обл|ул\.|улица|проспект|пр-т|пр\.|шоссе|переулок|пер\.|бульвар|б-р|набережная|наб\.|проезд|мкр)/i;
  const addrs = lines.filter(s => s.length <= 140 && !/₽/.test(s) && addrRe.test(s));
  r.address = addrs.find(s => /\d|москв/i.test(s)) || addrs[0] || '';
  const metroRe = /(?:^|[\s,])(?<!кв\.?\s?)(?:м\.|метро)\s?([А-ЯЁ][а-яё]+(?:[ -][А-ЯЁа-яё][а-яё]+)?)/g;
  while ((m = metroRe.exec(t))) {
    if (!/^(пешком|транспорт|минут|рядом|близко)/i.test(m[1])) { r.metro = m[1]; break; }
  }
  m = t.match(/https?:\/\/[^\s<>"]+/);
  if (m) r.link = m[0].replace(/[).,;:!?»"'\]]+$/, '');
  return r;
}
function parseTitle(r) {

/* ===== Раздел «Смета» ===== */
function smetaQty(item, sm) {
  if (item.qty === 'area') return sm.area;
  if (item.qty === 'baths') return sm.baths;
  if (item.qty === 'doors') return sm.rooms + sm.baths;
  return 1;
}
function smetaPrice(item, sm) {
  const key = item.k + '_' + sm.level;
  return sm.custom[key] != null ? sm.custom[key] : item.p[sm.level];
}
function smetaTotal() {
  const sm = S.smeta;
  const lines = SMETA_ITEMS.map(it => { const q = smetaQty(it, sm), p = smetaPrice(it, sm); return {it, q, p, sum: q * p}; });
  const sub = lines.reduce((s, l) => s + l.sum, 0);
  const extra = sub * sm.contingency / 100;
  return {lines, sub, extra, total: sub + extra};
}

/* ===== Раздел «Торги» ===== */
// Предел ставки: максимальная цена покупки, при которой сделка выходит на цель по доходности.
// Торги добавляют расходы (extra) и удлиняют проект (delay); остальное берётся из «Расчёта».
// Если расчёт открыт из сделки по лоту, расходы торгов в нём уже есть (torgiExtra/torgiDelay) —
// их вычитаем, чтобы не учесть дважды. Предел округляется вниз до 10 тыс. и служит порогом везде.
function torgiBase(c0) {
  return {buyCosts: Math.max(0, c0.buyCosts - (c0.torgiExtra || 0)), months: Math.max(1, c0.months - (c0.torgiDelay || 0))};
}
function torgiPlan(c0, t) {
  const b = torgiBase(c0);
  const c = Object.assign({}, c0, {buyCosts: b.buyCosts + t.extra, months: b.months + t.delay, torgiExtra: t.extra, torgiDelay: t.delay});
  const at = p => compute(Object.assign({}, c, {price: p}));
  const maxBid = c.sale > 0 ? solve(p => at(p).annual, 1, c.sale, c.target) : null;
  const zeroBid = c.sale > 0 ? solve(p => at(p).net, 1, c.sale * 2, 0) : null;
  const limit = maxBid > 0 ? round10k(maxBid) : 0;
  const stages = [];
  if (t.kind === 'offer') {
    for (let i = 0; i <= t.periods; i++) {
      const p = t.start * (1 - t.drop * i / 100);
      if (p <= 0) break;
      stages.push({i, p, r: at(p)});
    }
  }
  const entry = limit > 0 ? stages.find(s => s.p <= limit) : null;
  const stepSum = t.start * t.step / 100;
  const steps = t.kind === 'auction' && limit > t.start && stepSum > 0 ? Math.floor((limit - t.start) / stepSum) : 0;
  let verdict, cls, why;
  if (c.sale <= 0) {
    verdict = 'Заполните расчёт'; cls = 'warn'; why = 'Нужна цена продажи в разделе «Расчёт».';
  } else if (t.start <= 0) {
    verdict = 'Впишите начальную цену'; cls = 'warn'; why = 'Начальная цена лота есть в сообщении о торгах.';
  } else if (!(maxBid > 0)) {
    verdict = 'Не участвовать'; cls = 'bad'; why = 'Даже почти даром сделка не выходит на цель ' + pct(c.target) + ' годовых.';
  } else if (t.kind === 'auction') {
    if (t.start <= limit) {
      verdict = 'Ставка до ' + rub(limit); cls = 'good';
      why = 'Начальная цена ниже предела' + (stepSum > 0 ? ': запас примерно ' + steps + ' шаг. аукциона по ' + rub(stepSum) : '') +
        '. Дороже ' + rub(limit) + ' доходность ниже цели ' + pct(c.target) + '.';
    } else if (t.start <= maxBid) {
      verdict = 'Только по начальной цене'; cls = 'warn';
      why = 'Начальная цена ' + rub(t.start) + ' почти на пределе: доходность ' + pct(at(t.start).annual) + ' годовых — ровно цель. Поднимать ставку нельзя.';
    } else {
      verdict = 'Не участвовать'; cls = 'bad';
      why = 'Начальная цена ' + rub(t.start) + ' уже выше предела ' + rub(limit) + ': доходность ' + pct(at(t.start).annual) + ' годовых — ниже цели ' + pct(c.target) + '.';
    }
  } else if (entry) {
    verdict = 'Заявка на этапе ' + (entry.i + 1); cls = 'good';
    why = 'На этапе ' + (entry.i + 1) + ' цена ' + rub(entry.p) + ' — не выше предела ' + rub(limit) + '. Предложить можно и больше цены этапа, но не дороже ' + rub(limit) + ': другие участники тоже ждут снижения.';
  } else {
    verdict = 'Не участвовать'; cls = 'bad';
    why = 'Даже на последнем этапе цена ' + rub(stages.length ? stages[stages.length - 1].p : t.start) + ' выше предела ' + rub(limit) + '.';
  }
  const deposit = (entry ? entry.p : t.start) * t.deposit / 100;
  return {c, at, maxBid, zeroBid, limit, stages, entry, stepSum, steps, verdict, cls, why, deposit};
}

/* ===== Навигация ===== */
const TITLES = {calc: 'Калькулятор сделки', smeta: 'Смета ремонта', torgi: 'Торги и лоты', deals: 'Мои сделки', ref: 'Справочник'};
// Крупный заголовок раздела; он же появляется в шапке, когда при прокрутке ушёл вверх
function setTitle(text, action, back, backAction, backLabel) {
  $('#lt').textContent = text; $('#sub').textContent = text; $('#ltAct').innerHTML = action || '';
  const b = $('#ltBack');
  b.classList.toggle('hide', !back);
  b.dataset.a = backAction || 'deal-close';
  b.textContent = backLabel || '‹ Сделки';
}
function onScroll() {
  $('#top').classList.toggle('scrolled', $('#lt').getBoundingClientRect().bottom < $('#top').getBoundingClientRect().bottom);
}
window.addEventListener('scroll', onScroll, {passive: true});
// Переход экрана: anim-up — смена вкладки, anim-right — вглубь, anim-left — назад
function animate(cls) {
  const v = $('#view'); v.classList.remove('anim-up', 'anim-right', 'anim-left'); void v.offsetWidth; v.classList.add(cls);
}
function go(tab) {
  S.tab = tab; save();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  setTitle(TITLES[tab]);
  ({calc: renderCalc, smeta: renderSmeta, torgi: renderTorgi, deals: renderDeals, ref: renderRef})[tab]();
  window.scrollTo(0, 0); animate('anim-up'); onScroll();
}
function openDealView(id) { openDeal = id; renderDeals(); window.scrollTo(0, 0); animate('anim-right'); onScroll(); }
function closeDeal() { openDeal = null; renderDeals(); window.scrollTo(0, 0); animate('anim-left'); onScroll(); }
// Свайп от левого края в карточке сделки — назад к списку, как в iOS
let swipe = null;
document.addEventListener('touchstart', e => {
  const p = e.touches[0];
  swipe = standalone && ((S.tab === 'deals' && openDeal) || (S.tab === 'ref' && rayonView)) && p.clientX < 30 ? {x: p.clientX, y: p.clientY} : null;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (!swipe) return;
  const p = e.changedTouches[0], dx = p.clientX - swipe.x, dy = Math.abs(p.clientY - swipe.y);
  swipe = null;
  if (dx > 70 && dy < 60) { if (S.tab === 'ref') rayonBack(); else closeDeal(); }
}, {passive: true});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) { if (b.dataset.tab === 'deals') openDeal = null; if (b.dataset.tab === 'ref') { rayonView = null; rayonFrom = null; } go(b.dataset.tab); } });

/* ===== Ввод данных ===== */
const view = $('main');  // события ловим на всём main: и в разделе, и у кнопки рядом с крупным заголовком
const INT_KEYS = ['months', 'term'];
view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'priceSlide') {
    S.calc.price = Math.round(+t.value || 0); save();
    const pf = view.querySelector('input[data-k="price"]'); if (pf) pf.value = num(S.calc.price);
    const pv = $('#priceVal'); if (pv) pv.textContent = rub(S.calc.price);
    updateCalcResults(); return;
  }
  if (t.dataset.k && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
    let v = parseNum(t.value); if (INT_KEYS.includes(t.dataset.k)) v = Math.max(1, Math.round(v) || 1);
    S.calc[t.dataset.k] = v; save(); updateCalcResults();
    if (t.dataset.k === 'price') { const sl = $('#priceSlide'), pv = $('#priceVal'); if (sl) sl.value = v; if (pv) pv.textContent = rub(v); }
  } else if (t.dataset.sm) {
    let v = parseNum(t.value); if (t.dataset.sm !== 'area' && t.dataset.sm !== 'contingency') v = Math.max(0, Math.round(v));
    S.smeta[t.dataset.sm] = v; save(); updateSmetaTableKeepFocus();
  } else if (t.dataset.price) {
    S.smeta.custom[t.dataset.price + '_' + S.smeta.level] = parseNum(t.value); save(); updateSmetaTableKeepFocus(t.dataset.price);
  } else if (t.dataset.d) {
    const d = S.deals.find(x => x.id === openDeal); if (!d) return;
    d[t.dataset.d] = t.dataset.d === 'saleFact' ? parseNum(t.value) : t.value; d.updated = Date.now(); save();
    // точечное обновление: перерисовка всей карточки съедала первое нажатие на кнопку ниже
    if (t.dataset.d === 'name') setTitle(d.name || 'Сделка', '', true);
    if (t.dataset.d === 'link') $('#dealLink').innerHTML = dealLinkHtml(d);
    if (t.dataset.d === 'saleFact') $('#dealFact').innerHTML = dealFactHtml(d);
  } else if (t.dataset.t) {
    let v = Math.max(0, parseNum(t.value)); if (t.dataset.t === 'periods') v = Math.min(30, Math.max(1, Math.round(v) || 1));
    S.torgi[t.dataset.t] = v; save(); updateTorgiResults();
  } else if (t.id === 'parseText') {
    parseDraft = t.value;
  } else if (t.id === 'rayonQ') {
    rayonQuery = t.value; $('#rayonList').innerHTML = rayonListHtml();
  } else if (t.id === 'adExtra') {
    adExtra = t.value;
  } else if (t.dataset.pn) {
    if (t.value.trim()) S.rayony.notes[t.dataset.pn] = t.value; else delete S.rayony.notes[t.dataset.pn];
    save();
  } else if (t.dataset.rn) {
    if (t.value.trim()) S.rayony.dnotes[t.dataset.rn] = t.value; else delete S.rayony.dnotes[t.dataset.rn];
    save();
  } else if (t.id === 'sellM2') {
    S.sellM2 = Math.max(0, parseNum(t.value)); save();
  }
});
// Пересчёт таблицы сметы без потери курсора в поле цены
function updateSmetaTableKeepFocus(priceKey) {
  if (!priceKey) return updateSmetaTable();
  const pos = document.activeElement && document.activeElement.selectionStart;
  updateSmetaTable();
  const inp = view.querySelector('[data-price="' + priceKey + '"]');
  if (inp) { inp.value = num(S.smeta.custom[priceKey + '_' + S.smeta.level]); inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }
}
view.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.k === 'tax') { S.calc.tax = t.value; save(); $('#repDedBox').classList.toggle('hide', t.value !== 'ndfl'); updateCalcResults(); }
  else if (t.dataset.k === 'repairDed') { S.calc.repairDed = t.checked; save(); updateCalcResults(); }
  else if (t.id === 'dealRayonSel') {
    const d = S.deals.find(x => x.id === openDeal); if (!d) return;
    d.rayon = t.value; d.updated = Date.now(); save(); $('#dealRayon').innerHTML = dealRayonHtml(d);
  } else if (t.dataset.ad) {
    if (t.checked) adSel.add(t.dataset.ad); else adSel.delete(t.dataset.ad);
    $('#adText').value = adText(rayonById(rayonView), adSel);
  }
  else if (t.dataset.check) {
    const d = S.deals.find(x => x.id === openDeal); if (!d) return;
    d.checks = d.checks || {}; d.checks[t.dataset.check] = t.checked; d.updated = Date.now(); save(); renderDeal(d);
  } else if (t.id === 'backupFile' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.deals)) throw new Error('bad');
        if (!confirm('Заменить текущие данные копией? Сделок в копии: ' + data.deals.length)) return;
        localStorage.setItem(LS_KEY, JSON.stringify(data)); S = load(); toast('Копия загружена'); go('deals');
      } catch (err) { toast('Это не файл копии Флипологии'); }
    };
    r.readAsText(t.files[0]);
  }
});
// Красивое форматирование чисел после ввода
view.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset.k && t.type === 'text') {
    const v = S.calc[t.dataset.k]; const pctLike = ['commission', 'down', 'rate', 'target', 'months', 'term'].includes(t.dataset.k);
    t.value = pctLike ? String(v).replace('.', ',') : num(v);
    if (t.dataset.k === 'price') syncPriceSlide();
  }
  if (t.dataset.price) t.value = num(parseNum(t.value));
  if (t.id === 'expSum' && t.value) t.value = num(parseNum(t.value));
  if (t.dataset.t && t.type === 'text') { const v = S.torgi[t.dataset.t]; t.value = ['start', 'extra'].includes(t.dataset.t) ? num(v) : String(v).replace('.', ','); }
  if (t.id === 'sellM2' && t.value) t.value = num(S.sellM2);
});

/* ===== Кнопки ===== */
view.addEventListener('click', e => {
  const segBtn = e.target.closest('.seg button');
  if (segBtn) {
    const seg = segBtn.parentElement.dataset.seg;
    if (seg === 'fin') { S.calc.fin = segBtn.dataset.v; $('#mortBox').classList.toggle('hide', S.calc.fin !== 'mortgage'); updateCalcResults(); }
    if (seg === 'level') { S.smeta.level = Number(segBtn.dataset.v); updateSmetaTable(); }
    if (seg === 'tkind') { S.torgi.kind = segBtn.dataset.v; save(); renderTorgi(); return; }
    if (seg === 'rblock') { rayonBlock = segBtn.dataset.v; $('#rayonBlock').innerHTML = rayonBlockHtml(rayonById(rayonView), rayonBlock); }
    segBtn.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === segBtn));
    save(); return;
  }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  const d = S.deals.find(x => x.id === openDeal);
  switch (a) {
    case 'repair-from-smeta': {
      S.calc.repair = Math.round(smetaTotal().total); save(); renderCalc(); toast('Ремонт взят из сметы'); break;
    }
    case 'calc-detach': S.calcDeal = null; save(); renderCalc(); break;
    case 'calc-new-deal': {
      const name = ($('#newDealName').value || '').trim();
      if (!name) { toast('Впишите название сделки'); $('#newDealName').focus(); break; }
      const nd = newDeal(name, S.calc); S.calcDeal = nd.id; save(); renderCalc(); toast('Сделка создана — она в разделе «Сделки»'); break;
    }
    case 'calc-save-deal': {
      const cd = S.deals.find(x => x.id === S.calcDeal);
      if (cd) { cd.calc = Object.assign({}, S.calc); cd.updated = Date.now(); save(); toast('Расчёт сохранён в сделку'); }
      break;
    }
    case 'parse': {
      parseDraft = $('#parseText').value;
      if (!parseDraft.trim()) { toast('Вставьте текст объявления'); $('#parseText').focus(); break; }
      lastParse = parseListing(parseDraft); renderParseRes(); break;
    }
    case 'parse-fill':
      if (lastParse) { applyParse(lastParse); save(); renderCalc(); toast(lastParse.area ? 'Расчёт заполнен, ремонт посчитан по смете' : 'Цена перенесена в расчёт'); }
      break;
    case 'parse-deal': {
      if (!lastParse) break;
      const r = lastParse;
      applyParse(r);
      const nd = newDeal(parseTitle(r), S.calc);
      nd.address = r.address || ''; if (r.link) nd.link = r.link;
      nd.rayon = guessRayon(nd.address);
      nd.notes = 'Из объявления: ' + [r.price ? rub(r.price) : '', r.floor ? 'этаж ' + r.floor + ' из ' + r.floors : '', r.metro ? 'м. ' + r.metro : ''].filter(Boolean).join(', ');
      S.calcDeal = nd.id; save(); renderCalc(); toast('Сделка создана — она в разделе «Сделки»'); break;
    }
    case 'rayon-list': rayonView = 'list'; rayonFrom = null; rayonShow('anim-right'); break;
    case 'rayon-open': {
      // Отметки и дополнение держим, пока не открыт другой район
      if (adRayon !== b.dataset.id) { adSel = new Set(); adExtra = ''; adRayon = b.dataset.id; }
      rayonView = b.dataset.id; rayonBlock = 'deal';
      if (b.dataset.from === 'deal') { rayonFrom = 'deal'; go('ref'); } else { rayonFrom = null; rayonShow('anim-right'); }
      break;
    }
    case 'rayon-back': rayonBack(); break;
    case 'rayon-fav': {
      const i = S.rayony.fav.indexOf(rayonView);
      if (i >= 0) S.rayony.fav.splice(i, 1); else S.rayony.fav.push(rayonView);
      save(); renderRayon(rayonView); toast(i >= 0 ? 'Убрано из моих районов' : 'Добавлено в мои районы'); break;
    }
    case 'rayon-copy': {
      const txt = [$('#adText').value.trim(), adExtra.trim()].filter(Boolean).join('\n');
      if (!txt) { toast('Сначала отметьте места'); break; }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Абзац скопирован'), () => toast('Не получилось скопировать: выделите текст вручную'));
      else toast('Не получилось скопировать: выделите текст вручную');
      break;
    }
    case 'go-calc': go('calc'); break;
    case 'torgi-deal': {
      const name = ($('#lotName').value || '').trim();
      if (!name) { toast('Впишите название сделки'); $('#lotName').focus(); break; }
      const t = S.torgi, tp = torgiPlan(S.calc, t);
      const nd = newDeal(name, Object.assign({}, tp.c, {price: tp.cls === 'good' ? tp.limit : t.start}));
      const link = $('#lotLink').value.trim(); if (/^https?:\/\//i.test(link)) nd.link = link;
      nd.notes = 'Торги: ' + (t.kind === 'offer' ? 'публичное предложение' : 'аукцион') + ', начальная цена ' + rub(t.start) +
        ', предел ставки ' + (tp.maxBid > 0 ? rub(tp.limit) : '—') + ', задаток ' + rub(tp.deposit) + '.';
      save(); openDeal = nd.id; go('deals'); toast('Сделка по лоту создана'); break;
    }
    case 'smeta-to-calc': S.calc.repair = Math.round(smetaTotal().total); save(); go('calc'); toast('Ремонт перенесён в расчёт'); break;
    case 'smeta-reset':
      if (confirm('Вернуть ориентировочные цены вместо ваших?')) { S.smeta.custom = {}; save(); updateSmetaTable(); }
      break;
    case 'deal-new': { const nd = newDeal('Новая сделка', null); openDealView(nd.id); break; }
    case 'deal-open': openDealView(b.dataset.id); break;
    case 'deal-close': closeDeal(); break;
    case 'deal-share': if (d) shareDeal(d); break;
    case 'deal-stage': if (d) { d.stage = b.dataset.v; d.updated = Date.now(); save(); renderDeal(d); } break;
    case 'deal-to-calc':
      if (d) { S.calc = Object.assign({}, DEFAULT_CALC, d.calc || {}); S.calcDeal = d.id; save(); go('calc'); }
      break;
    case 'exp-add': {
      if (!d) break;
      const sum = parseNum($('#expSum').value);
      if (sum <= 0) { toast('Впишите сумму расхода'); $('#expSum').focus(); break; }
      d.expenses = d.expenses || [];
      d.expenses.push({id: uid(), cat: $('#expCat').value, sum, date: $('#expDate').value || today(), note: $('#expNote').value.trim()});
      d.updated = Date.now(); save(); renderDeal(d); toast('Расход добавлен'); break;
    }
    case 'exp-del':
      if (d && confirm('Удалить этот расход?')) { d.expenses = d.expenses.filter(x => x.id !== b.dataset.id); save(); renderDeal(d); }
      break;
    case 'deal-del':
      if (d && confirm('Удалить сделку «' + d.name + '» со всеми расходами?')) {
        S.deals = S.deals.filter(x => x.id !== d.id); if (S.calcDeal === d.id) S.calcDeal = null; openDeal = null; save(); renderDeals();
      }
      break;
    case 'backup-save': {
      S.lastBackup = Date.now(); save();
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = 'flipologia-kopiya-' + today() + '.json';
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      renderDeals();
      break;
    }
  }
});

/* ===== Подсказка «Установить на экран Домой» ===== */
let installEvt = null;  // предложение установки от Chrome/Android
const UA = navigator.userAgent || '';
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);  // iPadOS выдаёт себя за Mac
const inApp = !!window.TelegramWebviewProxy || /Telegram|FBAN|FBAV|Instagram/i.test(UA);  // встроенные браузеры: «На экран Домой» там нет
const HIDE_KEY = 'flipologia-hide-install';
function installHidden() { try { return localStorage.getItem(HIDE_KEY) === '1'; } catch (e) { return false; } }
const standalone = navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function showInstall() {
  if (standalone || installHidden()) return;
  let h;
  if (isIOS && inApp) h = 'Чтобы установить Флипологию как приложение, откройте эту страницу в <b>Safari</b> (меню ⋯ → «Открыть в Safari»), затем ' + SHARE_ICON + ' <b>«Поделиться»</b> → <b>«На экран Домой»</b>.';
  else if (isIOS) h = 'Установите Флипологию как приложение: нажмите ' + SHARE_ICON + ' <b>«Поделиться»</b>, затем <b>«На экран Домой»</b>.';
  else if (installEvt) h = 'Установите Флипологию на телефон — будет открываться как приложение, без браузера.<br><button class="btn pri" data-i="install">Установить</button>';
  else return;
  const el = $('#install');
  el.innerHTML = h + '<button class="x" data-i="close" aria-label="Закрыть">×</button>';
  el.classList.remove('hide'); document.body.classList.add('has-install');
}
$('#install').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  if (b.dataset.i === 'install' && installEvt) { installEvt.prompt(); installEvt = null; }
  try { localStorage.setItem(HIDE_KEY, '1'); } catch (err) {}
  $('#install').classList.add('hide'); document.body.classList.remove('has-install');
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
setTimeout(showInstall, 1500);

go(S.tab);
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
